spring:
  application:
    name: nexora-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Nexora Custom Application Properties
nexora:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JOZXhvcmFTb2NpYWxQbGF0Zm9ybTIwMjY=}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    issuer: nexora-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ais-dev-an74vq4s6nmx2f34ykkzrr-824579153854.asia-southeast1.run.app,https://ais-pre-an74vq4s6nmx2f34ykkzrr-824579153854.asia-southeast1.run.app}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age-secs: 3600
  rate-limit:
    enabled: true
    login-limit-per-minute: 5
    otp-limit-per-ten-minutes: 3
    otp-max-verify-attempts: 5
    post-limit-per-minute: 20
    comment-limit-per-minute: 30
    message-limit-per-minute: 30
    follow-limit-per-minute: 50
    search-limit-per-minute: 60
    general-limit-per-minute: 100
  otp:
    expiration-minutes: 10
    length: 6
    dev-mode-echo-console: true
